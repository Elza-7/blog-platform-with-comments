{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="auth-card">
        <p class="eyebrow">JOIN THE COMMUNITY</p>
        <h1>Create your account</h1>
        <p class="muted">A few details and you're ready to write.</p>
        <form method="POST" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Username<input name="username" required minlength="3" maxlength="30" autocomplete="username" placeholder="Choose a username"></label>
            <label>Email address<input type="email" name="email" required maxlength="120" autocomplete="email" placeholder="you@example.com"></label>
            <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label>
            <label>Confirm password<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" placeholder="Enter your password again"></label>
            <button class="button button-full" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</section>
{% endblock %}
