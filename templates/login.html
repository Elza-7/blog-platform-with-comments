{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Log in to InkSpace</h1>
        <p class="muted">Pick up where your ideas left off.</p>
        <form method="POST" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Username or email<input name="identity" required autocomplete="username" placeholder="Your username or email"></label>
            <label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label>
            <button class="button button-full" type="submit">Log in</button>
        </form>
        <p class="auth-switch">New to InkSpace? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</section>
{% endblock %}
